name: ci

on:
  push:
    branches: ['**']
    tags: ['sampler-v*']
  pull_request:
  workflow_dispatch:

jobs:
  sample:
    name: build + live sample (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, exe: perfwidget-sampler.exe }
          - { os: macos-latest, rid: osx-arm64, exe: perfwidget-sampler }
          - { os: ubuntu-latest, rid: linux-x64, exe: perfwidget-sampler }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build core + cross-platform app
        run: dotnet build src/PerfWidget.App/PerfWidget.App.csproj -c Release -warnaserror:CS8600,CS8602,CS8603

      - name: Build Windows (WPF) app
        if: runner.os == 'Windows'
        run: dotnet build src/PerfWidget.Wpf/PerfWidget.Wpf.csproj -c Release

      # Test the exact single-file sampler Orbit downloads, not a debug build.
      - name: Publish the sampler
        shell: bash
        run: |
          dotnet publish src/PerfWidget.Sampler/PerfWidget.Sampler.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o sampler
          if [ "$RUNNER_OS" = "macOS" ]; then codesign --force --sign - sampler/${{ matrix.exe }}; fi
          ./sampler/${{ matrix.exe }} --version

      # Something for the sampler to find: one thread spinning flat out, holding 300 MB it has touched.
      - name: Start a single-core CPU hog
        shell: pwsh
        run: |
          $py = if ($IsWindows) { 'python' } else { 'python3' }
          $p = Start-Process $py -ArgumentList '-c', '"b=b''x''*314572800; any(iter(int,1))"' -PassThru
          $p.Id | Out-File hog.pid
          Start-Sleep 2

      - name: Live snapshot (--json, --dump)
        shell: pwsh
        run: |
          $exe = "sampler/${{ matrix.exe }}"
          Start-Process $exe -ArgumentList '--json', 'now.json' -Wait -NoNewWindow
          Start-Process $exe -ArgumentList '--dump', 'dump.txt' -Wait -NoNewWindow
          Get-Content dump.txt -TotalCount 60

      - name: Check the numbers are real
        shell: pwsh
        run: ./scripts/check-snapshot.ps1 -Path now.json -Os '${{ runner.os }}'

      - name: Feed mode (what Orbit runs)
        shell: pwsh
        run: ./scripts/check-feed.ps1 -Sampler "sampler/${{ matrix.exe }}"

      - name: Stop the hog
        if: always()
        shell: pwsh
        run: if (Test-Path hog.pid) { Stop-Process -Id ([int](Get-Content hog.pid)) -Force -ErrorAction SilentlyContinue }

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: snapshot-${{ runner.os }}
          path: |
            now.json
            dump.txt

  package:
    name: package ${{ matrix.rid }}
    needs: sample
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish the widget and the sampler (self-contained, single file)
        shell: bash
        run: |
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            dotnet publish src/PerfWidget.Wpf/PerfWidget.Wpf.csproj -c Release -o out -p:PublishSingleFile=true -p:DebugType=none
          else
            dotnet publish src/PerfWidget.App/PerfWidget.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out
          fi
          dotnet publish src/PerfWidget.Sampler/PerfWidget.Sampler.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o sampler

      - name: Wrap as PerfWidget.app (macOS)
        if: startsWith(matrix.rid, 'osx')
        run: ./scripts/make-mac-app.sh out PerfWidget-${{ matrix.rid }}.zip

      - name: Tarball (Linux)
        if: matrix.rid == 'linux-x64'
        run: tar -czf PerfWidget-linux-x64.tar.gz -C out .

      - name: Zip (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath PerfWidget-win-x64.zip

      # The sampler alone, for Orbit: a zip on Windows, a tarball elsewhere (keeps the executable bit).
      - name: Package the sampler
        shell: bash
        run: |
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            pwsh -c "Compress-Archive -Path sampler/perfwidget-sampler.exe -DestinationPath perfwidget-sampler-win-x64.zip"
          else
            if [[ "${{ matrix.rid }}" == osx-* ]]; then codesign --force --sign - sampler/perfwidget-sampler; fi
            chmod +x sampler/perfwidget-sampler
            tar -czf perfwidget-sampler-${{ matrix.rid }}.tar.gz -C sampler perfwidget-sampler
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: PerfWidget-${{ matrix.rid }}
          path: PerfWidget-${{ matrix.rid }}.*

      - uses: actions/upload-artifact@v5
        with:
          name: perfwidget-sampler-${{ matrix.rid }}
          path: perfwidget-sampler-${{ matrix.rid }}.*

  # Tag sampler-vX.Y.Z to publish the samplers (and widget builds) as a release with SHA-256 sums.
  # Orbit pins the version and the sums, so a release is never edited after it is published.
  release:
    name: release
    needs: package
    if: startsWith(github.ref, 'refs/tags/sampler-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dl
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dl
          sha256sum perfwidget-sampler-* > SHA256SUMS
          cat SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" \
            --notes "Hidden sampler for Orbit's Machine Health, plus the widget builds. Verify downloads against SHA256SUMS." \
            perfwidget-sampler-* PerfWidget-* SHA256SUMS
