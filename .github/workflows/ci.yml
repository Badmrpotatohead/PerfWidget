name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sample:
    name: build + live sample (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build core + cross-platform app
        run: dotnet build src/PerfWidget.App/PerfWidget.App.csproj -c Release -warnaserror:CS8600,CS8602,CS8603

      - name: Build Windows (WPF) app
        if: runner.os == 'Windows'
        run: dotnet build src/PerfWidget.Wpf/PerfWidget.Wpf.csproj -c Release

      # Something for the sampler to find: one thread spinning flat out, holding 300 MB it has touched.
      - name: Start a single-core CPU hog
        shell: pwsh
        run: |
          $py = if ($IsWindows) { 'python' } else { 'python3' }
          $p = Start-Process $py -ArgumentList '-c', '"b=b''x''*314572800; any(iter(int,1))"' -PassThru
          $p.Id | Out-File hog.pid
          Start-Sleep 2

      - name: Live snapshot (--json, --dump)
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/PerfWidget.App/bin/Release/net10.0 -Filter 'PerfWidget*' | Where-Object { $_.Name -in 'PerfWidget','PerfWidget.exe' } | Select-Object -First 1
          # Start-Process -Wait: on Windows this is a GUI-subsystem exe, which &  would not wait for
          Start-Process $exe.FullName -ArgumentList '--json', 'now.json' -Wait -NoNewWindow
          Start-Process $exe.FullName -ArgumentList '--dump', 'dump.txt' -Wait -NoNewWindow
          Get-Content dump.txt -TotalCount 60

      - name: Check the numbers are real
        shell: pwsh
        run: ./scripts/check-snapshot.ps1 -Path now.json -Os '${{ runner.os }}'

      - name: Stop the hog
        if: always()
        shell: pwsh
        run: if (Test-Path hog.pid) { Stop-Process -Id ([int](Get-Content hog.pid)) -Force -ErrorAction SilentlyContinue }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-${{ runner.os }}
          path: |
            now.json
            dump.txt

  package:
    name: package ${{ matrix.rid }}
    needs: sample
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (self-contained, single file)
        shell: bash
        run: |
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            dotnet publish src/PerfWidget.Wpf/PerfWidget.Wpf.csproj -c Release -o out -p:PublishSingleFile=true -p:DebugType=none
          else
            dotnet publish src/PerfWidget.App/PerfWidget.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out
          fi

      - name: Wrap as PerfWidget.app (macOS)
        if: startsWith(matrix.rid, 'osx')
        run: ./scripts/make-mac-app.sh out PerfWidget-${{ matrix.rid }}.zip

      - name: Tarball (Linux)
        if: matrix.rid == 'linux-x64'
        run: tar -czf PerfWidget-linux-x64.tar.gz -C out .

      - name: Zip (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath PerfWidget-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PerfWidget-${{ matrix.rid }}
          path: PerfWidget-${{ matrix.rid }}.*
